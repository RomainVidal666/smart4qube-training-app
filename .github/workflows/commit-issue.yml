name: commit-issue

# Verifie que chaque commit de la PR contient un numero d'issue (#123).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour lister base..head
      - name: Verifier les messages de commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"
